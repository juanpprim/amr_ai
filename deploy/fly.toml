# Fly.io deployment configuration for AMR Learning Agent
#
# Uses the same image as Railway: nginx + oauth2-proxy (Auth0 OIDC) + Streamlit,
# with Chroma Cloud as the vector store (no persistent volume needed).
#
# Setup:
#   cp deploy/fly.toml fly.toml
#   fly launch --copy-config --no-deploy
#   fly secrets set \
#       OPENAI_API_KEY=sk-proj-... \
#       CHROMA_API_KEY=... CHROMA_TENANT=... CHROMA_DATABASE=... \
#       AUTH0_DOMAIN=... AUTH0_CLIENT_ID=... AUTH0_CLIENT_SECRET=... \
#       OAUTH2_PROXY_COOKIE_SECRET=$(openssl rand -base64 32) \
#       PUBLIC_HOSTNAME=amr-learning-agent.fly.dev \
#       OAUTH2_ALLOWED_EMAILS=a@x.com,b@y.com
#   fly deploy
#
# Single-user fallback (instead of Auth0): fly secrets set AMR_AUTH_PASSWORD=...

app = "amr-learning-agent"
primary_region = "mad"  # Madrid — closest to user

[build]
  dockerfile = "deploy/Dockerfile"

[http_service]
  internal_port = 8080              # nginx (proxies to Streamlit on 7860)
  force_https = true
  auto_stop_machines = "stop"       # scale to zero when idle
  auto_start_machines = true        # wake on request
  min_machines_running = 0          # allow full scale-down

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

# No persistent volume — vectors live in Chroma Cloud.

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
