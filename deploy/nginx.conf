# nginx reverse proxy for Streamlit (Fly.io / Railway)
#
# Supports two auth modes (selected by entrypoint.sh at runtime):
#   1. OAuth2 Proxy (Auth0 OIDC) — auth_request to oauth2-proxy on :4180
#   2. Basic auth (htpasswd) — fallback when OAuth2 secrets aren't set
#
# The auth mode is controlled by /etc/nginx/auth.conf, which is generated
# dynamically by entrypoint.sh before nginx starts.
#
# Also handles:
#   - Security headers (CSP, X-Robots-Tag, X-Frame-Options, etc.)
#   - Auth-specific rate limiting (brute-force mitigation)
#   - Static robots.txt serving (no auth)
#   - Health check endpoint (no auth — required by platform probes)
#   - WebSocket upgrade for Streamlit streaming

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout combined;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── Rate limiting ────────────────────────────────────────────
    # General: 10 req/s per IP (normal browsing)
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # Auth-specific: 1 req/s per IP (brute-force mitigation)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

    # ── Upstream: Streamlit ──────────────────────────────────────
    upstream streamlit {
        server 127.0.0.1:7860;
    }

    # ── WebSocket upgrade map ────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Fly/Railway terminate TLS at the edge; nginx only sees HTTP :8080.
    # Reconstruct the public URL for oauth2-proxy redirects.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      https;
    }

    map $http_host $forwarded_host {
        ~^(?<name>[^:/]+)  $name;
        default            $host;
    }

    server {
        listen 8080;
        server_name _;

        # Fly terminates TLS; don't let nginx rewrite redirects to http://:8080
        absolute_redirect off;
        port_in_redirect off;

        # ── Cold-start loading page ──────────────────────────────
        # When Streamlit is not yet ready, show a friendly page that
        # auto-refreshes every 3 seconds instead of a raw 502 error.
        error_page 502 503 504 /loading.html;
        location = /loading.html {
            internal;
            root /usr/share/nginx/html;
        }

        # ── Pending approval page (OAuth2 403) ──────────────────
        location = /pending-approval.html {
            auth_basic off;
            auth_request off;
            root /usr/share/nginx/html;
        }

        # ── Security headers (every response) ────────────────────
        add_header X-Robots-Tag            "noindex, nofollow" always;
        add_header X-Frame-Options         "DENY"              always;
        add_header X-Content-Type-Options  "nosniff"           always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self' data:; frame-ancestors 'none';" always;

        # ── Health check (no auth — required by platform probes) ──
        location = /_stcore/health {
            auth_basic off;
            auth_request off;
            proxy_pass http://streamlit;
            error_page 502 503 504 =200 /health-starting.txt;
        }

        # Return 200 with "starting" body during cold start so
        # platform health probes don't kill the container too early.
        location = /health-starting.txt {
            internal;
            auth_basic off;
            auth_request off;
            return 200 "starting";
        }

        # ── Static robots.txt (no auth) ─────────────────────────
        location = /robots.txt {
            auth_basic off;
            auth_request off;
            alias /app/robots.txt;
        }

        # ── OAuth2 Proxy endpoints ──────────────────────────────
        # Always present. In basic-auth mode these are never hit
        # because auth.conf uses auth_basic instead of auth_request.

        # Internal subrequest: nginx asks oauth2-proxy "is this user authenticated?"
        location = /oauth2/auth {
            internal;
            proxy_pass              http://127.0.0.1:4180;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $forwarded_proto;
            proxy_set_header        X-Forwarded-Host $forwarded_host;
            proxy_set_header        X-Forwarded-Port 443;
        }

        # Public: login page, callback, sign-out (must bypass auth gate)
        location /oauth2/ {
            auth_request off;
            auth_basic off;
            proxy_pass       http://127.0.0.1:4180;
            proxy_set_header Host $forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;

            # Show friendly "pending approval" page instead of raw 403
            proxy_intercept_errors on;
            error_page 403 /pending-approval.html;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Forwarded-Port 443;
        }

        # OAuth2 sign-in redirect (used by auth.conf error_page in OIDC mode)
        location @oauth2_signin {
            return 302 /oauth2/start?rd=$forwarded_proto://$forwarded_host$request_uri;
        }

        # ── Auth gate (all other routes) ─────────────────────────
        # /etc/nginx/auth.conf is generated by entrypoint.sh:
        #   OAuth2 mode:  auth_request /oauth2/auth; error_page 401 = ...
        #   Basic mode:   auth_basic "..."; auth_basic_user_file ...;
        include /etc/nginx/auth.conf;

        # ── Streamlit static assets (many parallel chunk loads on boot) ──
        location /static/ {
            limit_req zone=general burst=50 nodelay;

            proxy_pass         http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
            proxy_set_header   X-Auth-Request-User  $upstream_http_x_auth_request_user;
            proxy_set_header   X-Auth-Request-Email $upstream_http_x_auth_request_email;
        }

        # ── Streamlit internal endpoints (WebSocket + host-config, etc.) ──
        location /_stcore/ {
            proxy_pass         http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
            proxy_set_header   X-Auth-Request-User  $upstream_http_x_auth_request_user;
            proxy_set_header   X-Auth-Request-Email $upstream_http_x_auth_request_email;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_buffering    off;
        }

        # ── Streamlit main ───────────────────────────────────────
        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass         http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;

            # Pass authenticated user email to Streamlit (OAuth2 mode)
            proxy_set_header   X-Auth-Request-User  $upstream_http_x_auth_request_user;
            proxy_set_header   X-Auth-Request-Email $upstream_http_x_auth_request_email;

            # WebSocket support (critical for Streamlit)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_read_timeout 86400;
        }
    }
}
