<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMR Learning Agent - Pending Approval</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0e1117;
            color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
        p { color: #aaa; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1rem; }
        .email { color: #ff4b4b; }
        a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.6rem 1.5rem;
            background: #ff4b4b;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        a:hover { background: #e04343; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#128274;</div>
        <h1>Account Pending Approval</h1>
        <p>
            Your account has been created successfully, but access
            to the AMR Learning Agent requires administrator approval.
        </p>
        <p>
            Please contact the administrator to have your email
            added to the approved users list.
        </p>
        <a href="/oauth2/sign_out">Sign out</a>
    </div>
</body>
</html>
